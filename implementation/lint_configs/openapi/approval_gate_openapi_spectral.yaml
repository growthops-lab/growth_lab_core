extends:
  - spectral:oas
documentationUrl: https://api.example.invalid
rules:
  glc-openapi-version-3-1-0:
    description: "[Critical] OpenAPI version must be 3.1.0."
    message: "OpenAPI version must be 3.1.0."
    severity: error
    given: "$"
    then:
      field: openapi
      function: pattern
      functionOptions:
        match: "^3\\.1\\.0$"

  glc-root-required-fields:
    description: "[Critical] OpenAPI root object must include required top-level fields."
    message: "OpenAPI root object must include openapi, info, servers, tags, paths, and components."
    severity: error
    given: "$"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required:
            - openapi
            - info
            - servers
            - tags
            - paths
            - components

  glc-info-required-fields:
    description: "[Critical] info must include title and version."
    message: "info must include title and version."
    severity: error
    given: "$.info"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required:
            - title
            - version

  glc-components-required-fields:
    description: "[Critical] components must include schemas, responses, parameters, and securitySchemes."
    message: "components must include schemas, responses, parameters, and securitySchemes."
    severity: error
    given: "$.components"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required:
            - schemas
            - responses
            - parameters
            - securitySchemes

  glc-server-placeholder-only:
    description: "[Blocker] Only the approved placeholder server URL is allowed."
    message: "servers.url must be the approved placeholder URL only."
    severity: error
    given: "$.servers[*]"
    then:
      field: url
      function: pattern
      functionOptions:
        match: "^(?:https)://api\\.example\\.invalid$"

  glc-no-oauth-authorization-url:
    description: "[Blocker] OAuth authorizationUrl must not be finalized in the MVP OpenAPI draft."
    message: "authorizationUrl must not be defined in the MVP OpenAPI draft."
    severity: error
    given: "$..authorizationUrl"
    then:
      function: falsy

  glc-no-oauth-token-url:
    description: "[Blocker] OAuth tokenUrl must not be finalized in the MVP OpenAPI draft."
    message: "tokenUrl must not be defined in the MVP OpenAPI draft."
    severity: error
    given: "$..tokenUrl"
    then:
      function: falsy

  glc-no-oauth-scopes:
    description: "[Blocker] OAuth scopes must not be finalized in the MVP OpenAPI draft."
    message: "OAuth scopes must not be defined in the MVP OpenAPI draft."
    severity: error
    given: "$..scopes"
    then:
      function: falsy

  glc-required-paths:
    description: "[Major] Required Approval Gate API paths must exist."
    message: "Required Approval Gate API paths are missing."
    severity: warn
    given: "$.paths"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required:
            - /approval-gates
            - /approval-gates/{approval_gate_id}
            - /approval-gates/{approval_gate_id}/transition
            - /approval-gates/{approval_gate_id}/review-logs
            - /approval-gates/{approval_gate_id}/evidence-references
            - /approval-gates/{approval_gate_id}/audit-logs
            - /approval-gates/{approval_gate_id}/archive
            - /approval-gates/{approval_gate_id}/invalidate

  glc-required-approval-gates-operations:
    description: "[Major] /approval-gates must include GET and POST operations."
    message: "/approval-gates must include GET and POST operations."
    severity: warn
    given: "$.paths['/approval-gates']"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required:
            - get
            - post

  glc-required-approval-gate-id-operations:
    description: "[Major] /approval-gates/{approval_gate_id} must include GET and PATCH operations."
    message: "/approval-gates/{approval_gate_id} must include GET and PATCH operations."
    severity: warn
    given: "$.paths['/approval-gates/{approval_gate_id}']"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required:
            - get
            - patch

  glc-required-transition-operation:
    description: "[Major] Transition endpoint must include POST operation."
    message: "/approval-gates/{approval_gate_id}/transition must include POST operation."
    severity: warn
    given: "$.paths['/approval-gates/{approval_gate_id}/transition']"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required:
            - post

  glc-required-review-log-operations:
    description: "[Major] Review Log endpoint must include GET and POST operations."
    message: "/approval-gates/{approval_gate_id}/review-logs must include GET and POST operations."
    severity: warn
    given: "$.paths['/approval-gates/{approval_gate_id}/review-logs']"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required:
            - get
            - post

  glc-required-evidence-reference-operations:
    description: "[Major] Evidence Reference endpoint must include GET and POST operations."
    message: "/approval-gates/{approval_gate_id}/evidence-references must include GET and POST operations."
    severity: warn
    given: "$.paths['/approval-gates/{approval_gate_id}/evidence-references']"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required:
            - get
            - post

  glc-required-audit-log-operation:
    description: "[Major] Audit Log endpoint must include GET operation."
    message: "/approval-gates/{approval_gate_id}/audit-logs must include GET operation."
    severity: warn
    given: "$.paths['/approval-gates/{approval_gate_id}/audit-logs']"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required:
            - get

  glc-required-archive-operation:
    description: "[Major] Archive endpoint must include POST operation."
    message: "/approval-gates/{approval_gate_id}/archive must include POST operation."
    severity: warn
    given: "$.paths['/approval-gates/{approval_gate_id}/archive']"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required:
            - post

  glc-required-invalidate-operation:
    description: "[Major] Invalidate endpoint must include POST operation."
    message: "/approval-gates/{approval_gate_id}/invalidate must include POST operation."
    severity: warn
    given: "$.paths['/approval-gates/{approval_gate_id}/invalidate']"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required:
            - post

  glc-required-operation-ids:
    description: "[Major] Required Approval Gate operationIds must exist."
    message: "Required Approval Gate operationIds are missing."
    severity: warn
    given: "$.paths"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          properties:
            /approval-gates:
              type: object
              properties:
                get:
                  type: object
                  properties:
                    operationId:
                      const: listApprovalGates
                  required:
                    - operationId
                post:
                  type: object
                  properties:
                    operationId:
                      const: createApprovalGate
                  required:
                    - operationId
            /approval-gates/{approval_gate_id}:
              type: object
              properties:
                get:
                  type: object
                  properties:
                    operationId:
                      const: getApprovalGate
                  required:
                    - operationId
                patch:
                  type: object
                  properties:
                    operationId:
                      const: updateApprovalGateMetadata
                  required:
                    - operationId
            /approval-gates/{approval_gate_id}/transition:
              type: object
              properties:
                post:
                  type: object
                  properties:
                    operationId:
                      const: transitionApprovalGate
                  required:
                    - operationId
            /approval-gates/{approval_gate_id}/review-logs:
              type: object
              properties:
                get:
                  type: object
                  properties:
                    operationId:
                      const: listApprovalGateReviewLogs
                  required:
                    - operationId
                post:
                  type: object
                  properties:
                    operationId:
                      const: createApprovalGateReviewLog
                  required:
                    - operationId
            /approval-gates/{approval_gate_id}/evidence-references:
              type: object
              properties:
                get:
                  type: object
                  properties:
                    operationId:
                      const: listApprovalGateEvidenceReferences
                  required:
                    - operationId
                post:
                  type: object
                  properties:
                    operationId:
                      const: createApprovalGateEvidenceReference
                  required:
                    - operationId
            /approval-gates/{approval_gate_id}/audit-logs:
              type: object
              properties:
                get:
                  type: object
                  properties:
                    operationId:
                      const: listApprovalGateAuditLogs
                  required:
                    - operationId
            /approval-gates/{approval_gate_id}/archive:
              type: object
              properties:
                post:
                  type: object
                  properties:
                    operationId:
                      const: archiveApprovalGate
                  required:
                    - operationId
            /approval-gates/{approval_gate_id}/invalidate:
              type: object
              properties:
                post:
                  type: object
                  properties:
                    operationId:
                      const: invalidateApprovalGate
                  required:
                    - operationId

  glc-required-schemas:
    description: "[Major] Required reusable schemas must exist."
    message: "Required reusable schemas are missing."
    severity: error
    given: "$.components.schemas"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required:
            - ApprovalGate
            - ApprovalGateCreateRequest
            - ApprovalGateUpdateRequest
            - ApprovalGateTransitionRequest
            - ApprovalGateTransitionResponse
            - ApprovalGateTransitionErrorResponse
            - ApprovalGateTransitionState
            - ApprovalGateTransitionAuditEvent
            - ApprovalGateTransitionReviewChecks
            - ApprovalGateReviewCheckStatus
            - ApprovalGateActorRole
            - SafeApprovalReference
            - PublishMode
            - ReviewLog
            - ReviewLogCreateRequest
            - EvidenceReference
            - EvidenceReferenceCreateRequest
            - AuditLog
            - ErrorResponse
            - ValidationResult
            - ApprovalGateStatus
            - DecisionCategory
            - ReviewStatus
            - LabelCheckStatus
            - AutomationAllowedStatus
            - Role
  glc-required-responses:
    description: "[Major] Required reusable response components must exist."
    message: "Required reusable response components are missing."
    severity: error
    given: "$.components.responses"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required:
            - BadRequest
            - Unauthorized
            - Forbidden
            - NotFound
            - ValidationError
            - SecretValueRejected
            - InternalServerError
            - ApprovalGateTransitionInvalidInput
            - ApprovalGateTransitionNotFound
            - ApprovalGateTransitionConflict
            - ApprovalGateTransitionRejected
            - ApprovalGateTransitionPersistenceFailure
  glc-required-parameters:
    description: "[Major] Required reusable parameter components must exist."
    message: "Required reusable parameter components are missing."
    severity: warn
    given: "$.components.parameters"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required:
            - ApprovalGateIdPath
            - LimitQuery
            - OffsetQuery

  glc-required-security-scheme:
    description: "[Critical] BearerAuthPlaceholder security scheme must exist."
    message: "BearerAuthPlaceholder security scheme is missing."
    severity: error
    given: "$.components.securitySchemes"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required:
            - BearerAuthPlaceholder

  glc-approval-gate-status-enum:
    description: "[Critical] ApprovalGateStatus must exactly match the Core status union."
    message: "ApprovalGateStatus must contain exactly the seven Core status values."
    severity: error
    given: "$.components.schemas.ApprovalGateStatus"
    then:
      field: enum
      function: schema
      functionOptions:
        schema:
          type: array
          minItems: 7
          maxItems: 7
          uniqueItems: true
          allOf:
            - contains: { const: DRAFT }
            - contains: { const: REVIEW_REQUIRED }
            - contains: { const: APPROVED }
            - contains: { const: BLOCKED }
            - contains: { const: DEFERRED }
            - contains: { const: PUBLISHED }
            - contains: { const: ARCHIVED }
  glc-decision-category-enum:
    description: "[Critical] DecisionCategory must exactly match the Core decision category union."
    message: "DecisionCategory must contain exactly the Core decision category values."
    severity: error
    given: "$.components.schemas.DecisionCategory"
    then:
      field: enum
      function: schema
      functionOptions:
        schema:
          type: array
          minItems: 7
          maxItems: 7
          uniqueItems: true
          allOf:
            - contains: { const: APPROVED_FOR_MVP_PUBLISHING }
            - contains: { const: APPROVED_WITH_MANUAL_REVIEW }
            - contains: { const: BLOCKED_MISSING_EVIDENCE }
            - contains: { const: BLOCKED_TERMS_UNCERTAINTY }
            - contains: { const: DEFERRED_LATER_SPECIFICATION }
            - contains: { const: REQUIRES_HUMAN_OWNER_DECISION }
            - contains: { const: REQUIRES_OFFICIAL_SOURCE_CONFIRMATION }
  glc-review-status-enum:
    description: "[Major] ReviewStatus enum must contain the MVP review status values."
    message: "ReviewStatus enum must contain all MVP review status values."
    severity: warn
    given: "$.components.schemas.ReviewStatus"
    then:
      field: enum
      function: schema
      functionOptions:
        schema:
          type: array
          minItems: 6
          allOf:
            - contains:
                const: Not Reviewed
            - contains:
                const: Review Required
            - contains:
                const: Reviewed
            - contains:
                const: Approved
            - contains:
                const: Blocked
            - contains:
                const: Deferred

  glc-label-check-status-enum:
    description: "[Major] LabelCheckStatus enum must contain the MVP label check status values."
    message: "LabelCheckStatus enum must contain all MVP label check status values."
    severity: warn
    given: "$.components.schemas.LabelCheckStatus"
    then:
      field: enum
      function: schema
      functionOptions:
        schema:
          type: array
          minItems: 6
          allOf:
            - contains:
                const: Not Required
            - contains:
                const: Required
            - contains:
                const: Applied
            - contains:
                const: Missing
            - contains:
                const: Unknown
            - contains:
                const: Deferred

  glc-automation-allowed-status-enum:
    description: "[Critical] AutomationAllowedStatus must exactly match the Core union."
    message: "AutomationAllowedStatus must contain exactly the Core automation values."
    severity: error
    given: "$.components.schemas.AutomationAllowedStatus"
    then:
      field: enum
      function: schema
      functionOptions:
        schema:
          type: array
          minItems: 5
          maxItems: 5
          uniqueItems: true
          allOf:
            - contains: { const: ALLOWED }
            - contains: { const: NOT_ALLOWED }
            - contains: { const: UNKNOWN }
            - contains: { const: NOT_APPLICABLE }
            - contains: { const: DEFERRED }
  glc-role-enum:
    description: "[Major] Role enum must contain the MVP role values."
    message: "Role enum must contain all MVP role values."
    severity: warn
    given: "$.components.schemas.Role"
    then:
      field: enum
      function: schema
      functionOptions:
        schema:
          type: array
          minItems: 6
          allOf:
            - contains:
                const: Human Owner
            - contains:
                const: Reviewer
            - contains:
                const: Operator
            - contains:
                const: Developer
            - contains:
                const: Auditor
            - contains:
                const: System

  glc-transition-request-required-fields:
    description: "[Critical] Transition request must be closed and contain the Core wire-contract fields only."
    message: "ApprovalGateTransitionRequest must require the four optimistic-concurrency request fields and allow only the approved contract fields."
    severity: error
    given: "$.components.schemas.ApprovalGateTransitionRequest"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required:
            - properties
            - required
            - additionalProperties
            - allOf
          properties:
            additionalProperties:
              const: false
            required:
              type: array
              minItems: 4
              maxItems: 4
              uniqueItems: true
              allOf:
                - contains: { const: from_status }
                - contains: { const: to_status }
                - contains: { const: expected_record_version }
                - contains: { const: transition_request_id }
            properties:
              type: object
              propertyNames:
                enum:
                  - from_status
                  - to_status
                  - expected_record_version
                  - transition_request_id
                  - decision_category
                  - decision_reason
                  - blocked_reason
                  - deferred_items
                  - content_reference
                  - review_reference
                  - evidence_reference
                  - publish_request_reference
                  - archive_reference
                  - review_checks
                  - publish_mode
                  - automation_allowed_status
                  - published_at
              required:
                - from_status
                - to_status
                - expected_record_version
                - transition_request_id
                - decision_category
                - decision_reason
                - blocked_reason
                - deferred_items
                - content_reference
                - review_reference
                - evidence_reference
                - publish_request_reference
                - archive_reference
                - review_checks
                - publish_mode
                - automation_allowed_status
                - published_at
  glc-blocked-reason-description:
    description: "[Major] Blocked transition must document blocked_reason requirement."
    message: "ApprovalGateTransitionRequest description should document blocked_reason requirement."
    severity: warn
    given: "$.components.schemas.ApprovalGateTransitionRequest"
    then:
      field: description
      function: pattern
      functionOptions:
        match: "blocked_reason"

  glc-deferred-items-description:
    description: "[Major] Deferred transition must document deferred_items requirement."
    message: "ApprovalGateTransitionRequest description should document deferred_items requirement."
    severity: warn
    given: "$.components.schemas.ApprovalGateTransitionRequest"
    then:
      field: description
      function: pattern
      functionOptions:
        match: "deferred_items"

  glc-published-condition-description:
    description: "[Major] Published transition must document published_at or publish_request_reference requirement."
    message: "ApprovalGateTransitionRequest description should document published_at or publish_request_reference requirement."
    severity: warn
    given: "$.components.schemas.ApprovalGateTransitionRequest"
    then:
      field: description
      function: pattern
      functionOptions:
        match: "published_at|publish_request_reference"

  glc-human-owner-condition-description:
    description: "[Major] Human Owner approval condition must be documented for publish-related transitions."
    message: "ApprovalGateTransitionRequest description should document Human Owner approval condition."
    severity: warn
    given: "$.components.schemas.ApprovalGateTransitionRequest"
    then:
      field: description
      function: pattern
      functionOptions:
        match: "Human Owner"

  glc-error-response-schema-required:
    description: "[Major] ErrorResponse schema must include safe error response fields."
    message: "ErrorResponse must include error_code and error_message properties."
    severity: warn
    given: "$.components.schemas.ErrorResponse"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required:
            - properties
          properties:
            properties:
              type: object
              required:
                - error_code
                - error_message

  glc-approval-gate-review-check-status-enum:
    description: "[Critical] Approval Gate review checks must exactly match the Core union."
    message: "ApprovalGateReviewCheckStatus must contain exactly the seven Core review-check values."
    severity: error
    given: "$.components.schemas.ApprovalGateReviewCheckStatus"
    then:
      field: enum
      function: schema
      functionOptions:
        schema:
          type: array
          minItems: 7
          maxItems: 7
          uniqueItems: true
          allOf:
            - contains: { const: PASS }
            - contains: { const: NOT_APPLICABLE }
            - contains: { const: UNKNOWN }
            - contains: { const: NOT_CHECKED }
            - contains: { const: WARNING }
            - contains: { const: BLOCKED }
            - contains: { const: DEFERRED }

  glc-safe-approval-reference-schema:
    description: "[Critical] SafeApprovalReference must be a bounded administrative reference."
    message: "SafeApprovalReference must be a string with the approved maximum length and pattern."
    severity: error
    given: "$.components.schemas.SafeApprovalReference"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required:
            - type
            - maxLength
            - pattern
          properties:
            type: { const: string }
            maxLength: { const: 128 }
            pattern:
              {
                const: "^[A-Za-z][A-Za-z0-9_]{0,31}-[A-Za-z0-9][A-Za-z0-9._-]{0,94}$",
              }

  glc-deferred-items-shape:
    description: "[Critical] deferred_items must be a non-empty array of non-blank strings."
    message: "deferred_items must be an array with at least one non-blank string item."
    severity: error
    given: "$.components.schemas.ApprovalGateTransitionRequest.properties.deferred_items"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required:
            - type
            - minItems
            - items
          properties:
            type: { const: array }
            minItems: { const: 1 }
            items:
              type: object
              required:
                - type
                - minLength
                - pattern
              properties:
                type: { const: string }
                minLength: { const: 1 }
                pattern: { const: ".*\\S.*" }

  glc-no-legacy-client-transition-fields:
    description: "[Critical] B0 clients must not supply actor, authorization, or legacy transition-check fields."
    message: "ApprovalGateTransitionRequest must not define forbidden client-controlled transition fields."
    severity: error
    given:
      - "$.components.schemas.ApprovalGateTransitionRequest.properties.requested_by"
      - "$.components.schemas.ApprovalGateTransitionRequest.properties.requested_at"
      - "$.components.schemas.ApprovalGateTransitionRequest.properties.actor_role"
      - "$.components.schemas.ApprovalGateTransitionRequest.properties.authorization_context"
      - "$.components.schemas.ApprovalGateTransitionRequest.properties.human_owner_decision_required"
      - "$.components.schemas.ApprovalGateTransitionRequest.properties.review_id"
      - "$.components.schemas.ApprovalGateTransitionRequest.properties.sns_terms_check"
      - "$.components.schemas.ApprovalGateTransitionRequest.properties.asp_terms_check"
      - "$.components.schemas.ApprovalGateTransitionRequest.properties.affiliate_terms_check"
    then:
      function: falsy
  glc-transition-success-response-allowlist:
    description: "[Critical] B0 transition success response must be closed and allowlisted."
    message: "ApprovalGateTransitionResponse must contain only approval_gate_id, state, and audit_event."
    severity: error
    given: "$.components.schemas.ApprovalGateTransitionResponse"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required:
            - additionalProperties
            - required
            - properties
          properties:
            additionalProperties: { const: false }
            required:
              type: array
              minItems: 3
              maxItems: 3
              uniqueItems: true
              allOf:
                - contains: { const: approval_gate_id }
                - contains: { const: state }
                - contains: { const: audit_event }
            properties:
              type: object
              propertyNames:
                enum:
                  - approval_gate_id
                  - state
                  - audit_event

  glc-transition-audit-event-allowlist:
    description: "[Critical] B0 audit events must contain only fixed safe references and transition metadata."
    message: "ApprovalGateTransitionAuditEvent must be closed and use only the approved field allowlist."
    severity: error
    given: "$.components.schemas.ApprovalGateTransitionAuditEvent"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required:
            - additionalProperties
            - required
            - properties
          properties:
            additionalProperties: { const: false }
            required:
              type: array
              minItems: 6
              maxItems: 6
              uniqueItems: true
              allOf:
                - contains: { const: event_type }
                - contains: { const: transition_request_id }
                - contains: { const: from_status }
                - contains: { const: to_status }
                - contains: { const: actor_role }
                - contains: { const: record_version }
            properties:
              type: object
              propertyNames:
                enum:
                  - event_type
                  - transition_request_id
                  - from_status
                  - to_status
                  - actor_role
                  - record_version
                  - content_reference
                  - review_reference
                  - evidence_reference
                  - publish_request_reference
                  - archive_reference

  glc-transition-error-response-allowlist:
    description: "[Critical] B0 transition errors must be closed, fixed, and non-reflective."
    message: "ApprovalGateTransitionErrorResponse must contain only error_code and error_message."
    severity: error
    given: "$.components.schemas.ApprovalGateTransitionErrorResponse"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required:
            - additionalProperties
            - required
            - properties
          properties:
            additionalProperties: { const: false }
            required:
              type: array
              minItems: 2
              maxItems: 2
              uniqueItems: true
              allOf:
                - contains: { const: error_code }
                - contains: { const: error_message }
            properties:
              type: object
              propertyNames:
                enum:
                  - error_code
                  - error_message
  glc-transition-error-no-internals:
    description: "[Critical] B0 transition errors must not expose request values or implementation internals."
    message: "ApprovalGateTransitionErrorResponse must not define reflective, stack, persistence, authorization, or audit-internal fields."
    severity: error
    given:
      - "$.components.schemas.ApprovalGateTransitionErrorResponse.properties.input"
      - "$.components.schemas.ApprovalGateTransitionErrorResponse.properties.stack"
