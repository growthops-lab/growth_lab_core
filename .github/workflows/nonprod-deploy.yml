name: Nonproduction deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Select DEPLOY_NONPRODUCTION to deploy the nonproduction service.
        required: true
        default: CANCEL
        type: choice
        options:
          - CANCEL
          - DEPLOY_NONPRODUCTION

permissions:
  contents: read
  id-token: write

concurrency:
  group: growth-lab-core-nonproduction
  cancel-in-progress: false

env:
  PROJECT_ID: growth-lab-core-nonproduction
  REGION: asia-northeast1
  AR_REPOSITORY: growth-lab-core-nonproduction
  SERVICE_NAME: growth-lab-core-nonproduction
  RUNTIME_SERVICE_ACCOUNT: glc-np-runtime@growth-lab-core-nonproduction.iam.gserviceaccount.com
  DEPLOYER_SERVICE_ACCOUNT: glc-np-gh-deployer@growth-lab-core-nonproduction.iam.gserviceaccount.com
  WORKLOAD_IDENTITY_PROVIDER: projects/794112846825/locations/global/workloadIdentityPools/github/providers/github
  IMAGE_URI: asia-northeast1-docker.pkg.dev/growth-lab-core-nonproduction/growth-lab-core-nonproduction/growth-lab-core

jobs:
  deploy:
    name: Build and deploy nonproduction
    if: inputs.confirmation == 'DEPLOY_NONPRODUCTION'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud through Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build image
        run: |
          docker build \
            --tag "${IMAGE_URI}:${GITHUB_SHA}" \
            --tag "${IMAGE_URI}:manual-latest" \
            .

      - name: Push image
        run: |
          docker push "${IMAGE_URI}:${GITHUB_SHA}"
          docker push "${IMAGE_URI}:manual-latest"

      - name: Deploy Cloud Run service
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE_URI}:${GITHUB_SHA}" \
            --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
            --ingress=internal-and-cloud-load-balancing \
            --allow-unauthenticated \
            --port=3000 \
            --cpu=1 \
            --memory=512Mi \
            --min-instances=0 \
